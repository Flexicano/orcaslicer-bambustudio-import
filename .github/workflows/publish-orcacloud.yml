# Publishes a GitHub release of this plugin to OrcaCloud.
# Based on the workflow from the OrcaCloud wiki ("Publish from GitHub").
# Authenticates with GitHub's OIDC token: no secrets needed.
name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  # OrcaCloud needs a target OS suffix in the file name; the plugin runs everywhere.
  PLUGIN_FILES: "dist/bambustudio_import_any.py"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Check release tag matches the plugin version
        run: |
          set -euo pipefail
          plugin_version="$(sed -n 's/^# version = "\(.*\)"$/\1/p' orca_plugins/bambustudio_import/bambustudio_import.py)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$plugin_version" != "$tag_version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match the plugin version $plugin_version" >&2
            exit 1
          fi

      - name: Build upload file
        run: |
          mkdir -p dist
          cp orca_plugins/bambustudio_import/bambustudio_import.py dist/bambustudio_import_any.py

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
